# 博客发布工作流：GitHub Pages 部署 + GHCR 镜像推送
# 推送 main 分支即触发；两个任务并行执行
# 要点：FixIt v1.0 依赖 dart-sass；主题经 git submodule 引入

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write        # Pages 部署
  id-token: write     # Pages 部署（OIDC）
  packages: write     # GHCR 推送

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.168.0   # 与本地版本保持一致

jobs:
  # ============ Job 1：构建静态站 + 部署 GitHub Pages ============
  pages:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O $HOME/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
            && sudo dpkg -i $HOME/hugo.deb
          hugo version

      - name: Install Dart Sass
        run: |
          sudo snap install sass -s stable
          sass --version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # 拉取 themes/fixit
          fetch-depth: 0          # 完整历史（lastmod 支持）

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: $HOME/.cache/hugo
          HUGO_ENVIRONMENT: production
        run: hugo --minify --cleanDestinationDir

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ============ Job 2：构建 Docker 镜像 + 推送 GHCR ============
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/blog:latest
            ghcr.io/${{ github.repository_owner }}/blog:${{ github.sha }}
          build-args: |
            BASE_URL=https://${{ github.repository_owner }}.github.io/
          cache-from: type=gha
          cache-to: type=gha,mode=max
