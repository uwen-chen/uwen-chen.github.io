# Hugo → GitHub Pages 自动部署
# 推送 main 分支即触发构建发布
# 要点：FixIt v1.0 依赖 dart-sass；主题经 git submodule 引入

name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.168.0   # 与本地版本保持一致
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O $HOME/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
            && sudo dpkg -i $HOME/hugo.deb
          hugo version

      - name: Install Dart Sass
        run: |
          sudo snap install sass -s stable
          sass --version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # 拉取 themes/fixit
          fetch-depth: 0          # 完整历史（lastmod 支持）

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: $HOME/.cache/hugo
          HUGO_ENVIRONMENT: production
        run: |
          hugo --minify --cleanDestinationDir

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
