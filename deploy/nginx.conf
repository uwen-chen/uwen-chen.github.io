# 静态博客 nginx 配置
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/javascript;

    # Hugo clean URLs：/posts/xxx/ → 目录内 index.html
    location / {
        try_files $uri $uri/index.html =404;
    }

    # 指纹化静态资源（FixIt 资源带 hash）长缓存
    location ~* \.(css|js|woff2?|svg|png|jpg|jpeg|webp|gif|ico|txt|xml)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # HTML 不缓存，保证发布即生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
}
